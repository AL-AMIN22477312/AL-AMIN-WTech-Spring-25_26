<!DOCTYPE html>
<html lang="eng"
<head>
    <h1>Student Registration Page</h1>
</head>
<form>
    <label for = "StudentName">Student Name :</label>
    <input type="Text" id="StudentName" name="StudentName" placeholder="Enter Your Name">
    <br><br>

    <label for="StudentCGPA">Student CGPA :</label>
    <input type="text" id="StudentCGPA" name="StudentCGPA" placeholder="Enter Your CGPA">
    <br><br>

    <label for="GenderMale"> Male</label>
    <input type="radio" id="GenderMale" name="Gender" value="Male">
    <br><br>

    <label for="GenderFemale"> Female</label>
     <input type="radio" id="GenderFemale" name="Gender" value="Female">
    <br><br>

    <label for="StudentDept">Select Department :</label>
    <select>
        <option value="CSE">CSE</option>
        <option value="EEE">EEE</option>
        <option value="ENGLISH">ENGLISH</option>
        <option value="LAE">LAW</option>
    </select>
    <br><br>

    <label for="StudentID">Student ID: </label>
    <input type="text" id="id" name="id">
    <br><br>

    <label for="Address">Address :</label>
    <textarea id="Address" name="Address" row="4" cols="25" placeholder="Enter your address here"></textarea>
    <br><br>

    <label for="DOB">Date of Birth :</label>
    <input type="date" id="DOB" name="DOB">
    <br><br>

    <label for="email">Email :</label>
    <input type="email" id="email" name="email" placeholder="Enter your email">
    <br><br>

    <label for="InserFile">Upload your Grade Report :</label>
    <input type="file" id="InserFile" name="InserFile">
    <br><br>

    <label for="Agree">I agree to the terms and conditions</label>
    <input type="checkbox" id="Agree" name="Agree">
    <br><br>

    <label for="Phone">Phone Number :</label>
    <input type="text" id="Phone" name="Phone" placeholder="Enter your Phone Number">
    <br><br>

    <label for="SubmitInfo">Submit your information</label>
    <br><br>
    <input type="submit" id="SubmitInfo" name="SubmitInfo">
    <br><br>

</form>
